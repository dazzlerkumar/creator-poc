syntax = "proto3";

package creator_stage.realtime.v1;

option go_package = "github.com/creator-stage/internal/proto;realtimepb";

import "google/protobuf/timestamp.proto";
import "common.proto";
// this is for the direction of audience to creator

// Audience WS uplink only (:dm for chat text). Set by the gateway on chat_ingest;
// clients omit on publish. Creator DMs use CreatorChatEvent (HTTP → chat_ingest).
// DM → replicated to audience_chat for derived :audience fan-out + ChatDB inbox.
// PEER is reserved/legacy (no :audience chat uplink in current design).
enum AudienceIngestRoute {
  AUDIENCE_INGEST_ROUTE_UNSPECIFIED = 0;
  AUDIENCE_INGEST_ROUTE_PEER        = 1;
  AUDIENCE_INGEST_ROUTE_DM          = 2;
}

message AudienceChatMessage {
  string                    id                 = 1;
  google.protobuf.Timestamp sent_at            = 2;
  string                    body               = 3;
  string                    user_id            = 4;
  string                    display_name       = 5;
  // Set by the server on ingest/archive; clients omit on WS publish (vb comes from the connection).
  string                    video_broadcast_id = 6;
  AudienceIngestRoute       ingest_route       = 7;
}


message AudienceQuizResponse {
  string id = 1;
  google.protobuf.Timestamp sent_at   = 2;
  string quiz_id = 3;
  string option_id = 4;

}

message AudienceVideoMetadata {
  string id = 1;
  google.protobuf.Timestamp sent_at   = 2;
  uint32 live_active_connections =3;

}

enum AudienceMessageType {
  TYPE_AUDIENCE_MESSAGE = 0;
  TYPE_POLL_RESPONSE=1;
  TYPE_VIDEO_METADATA=2;
}


message AudienceChatEvent {
  Role role = 1;
  AudienceMessageType                      type = 2;

  oneof body {
    AudienceChatMessage chat_message         = 10;
    AudienceQuizResponse   quiz_response =11;
  }
}


message BatchedChatMessages {
  uint32 live_active_connections = 1;
  repeated AudienceChatMessage messages = 2;
}


// Client → server in Centrifuge ConnectRequest.data when connecting without JWT.
message AudienceConnectData {
  string video_broadcast_id = 1;
  string user_id = 2;
  string display_name = 3;
}