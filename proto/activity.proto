syntax = "proto3";

package creator_stage.realtime.v1;

option go_package = "github.com/techpix/creator-stage/internal/realtime/proto;realtimepb";

import "google/protobuf/timestamp.proto";
import "chat.proto";

enum Type {
  TYPE_UNSPECIFIED = 0;
  TYPE_PIN         = 1;
  TYPE_UNPIN       = 2;
  TYPE_CTA_PUSH    = 3;
  TYPE_CTA_DISMISS = 4;
}

message Unpin {
  string message_id = 1;
}

message CTAPush {
  string label = 1;
  string url   = 2;
}

message CTADismiss {}

message ActivityEvent {
  Type                      type = 1;
  google.protobuf.Timestamp at   = 2;

  oneof body {
    ChatMessage pin         = 10;
    Unpin       unpin       = 11;
    CTAPush     cta_push    = 12;
    CTADismiss  cta_dismiss = 13;
  }
}
